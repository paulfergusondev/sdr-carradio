<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PyRadio SDR icon</title>
  <desc id="desc">A modern classic tabletop radio with amber display, metallic controls, and speaker grille.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b3d49"/>
      <stop offset="45%" stop-color="#2a2c36"/>
      <stop offset="100%" stop-color="#181a22"/>
    </linearGradient>
    <linearGradient id="face" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#4b4e5f"/>
      <stop offset="60%" stop-color="#262934"/>
      <stop offset="100%" stop-color="#161821"/>
    </linearGradient>
    <linearGradient id="display" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#083036"/>
      <stop offset="50%" stop-color="#041b21"/>
      <stop offset="100%" stop-color="#05161b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffcc72"/>
      <stop offset="50%" stop-color="#ffb547"/>
      <stop offset="100%" stop-color="#ff8f21"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#d8d9de"/>
      <stop offset="35%" stop-color="#8e92a2"/>
      <stop offset="70%" stop-color="#5e6170"/>
      <stop offset="100%" stop-color="#2b2d38"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffbb43" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff9d27" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9d27" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#090b10"/>
