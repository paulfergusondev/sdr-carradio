  <rect x="128" y="168" width="156" height="60" rx="14" fill="url(#glow)"/>
  <text x="206" y="209" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="40" font-weight="700" fill="url(#amber)">101.7</text>
  <text x="267" y="209" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#ffb95d">FM</text>
